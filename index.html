<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloxify Local AI | Uncensored</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/utility.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>

<body>

    <div class="app-wrapper">
        <!-- Sidebar Settings -->
        <aside class="sidebar">
            <h2>Veloxify AI</h2>

            <div class="setting-group">
                <label for="model-select">Active Model</label>
                <select id="model-select">
                    <option value="gemma-3-12b-it:latest" selected>Gemma-3 12B (Heretic)</option>
                    <option value="google-gemma-4-e4b-it:latest">Gemma-4 E4B (Latest 2026)</option>
                </select>
            </div>

            <div class="setting-group" style="padding-top: 15px; border-top: 1px solid var(--glass-border);">
                <label>Image Generator (FastSD CPU)</label>
                <div id="image-preview-container" style="display: none; margin-bottom: 10px; position: relative;">
                    <img id="image-preview" src=""
                        style="width: 100%; border-radius: 12px; border: 1px solid var(--accent-primary);">
                    <button id="remove-image-btn"
                        style="position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer;">×</button>
                    <button id="upscale-ref-btn"
                        style="position: absolute; top: 5px; right: 35px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 12px; padding: 2px 8px; cursor: pointer; font-size: 0.75rem;">✨
                        Upscale</button>
                </div>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button id="upload-btn" class="secondary-btn" style="width: 100%;">Upload Reference Image</button>
                <div class="checkbox-group" style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="auto-image-checkbox" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="auto-image-checkbox"
                        style="margin-bottom: 0; text-transform: none; font-size: 0.8rem; cursor: pointer;">Auto
                        Generate Images</label>
                </div>

                <div class="image-params"
                    style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--glass-border);">
                    <div class="setting-item" style="margin-bottom: 10px;">
                        <label for="image-size-select" style="font-size: 0.75rem; color: var(--text-secondary);">Image
                            Size</label>
                        <select id="image-size-select" style="width: 100%; font-size: 0.8rem; padding: 5px;">
                            <option value="512x512">512 x 512 (Square)</option>
                            <option value="768x512">768 x 512 (Landscape)</option>
                            <option value="512x768">512 x 768 (Portrait)</option>
                            <option value="256x256">256 x 256 (Square)</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="batch-size-slider"
                            style="font-size: 0.75rem; color: var(--text-secondary); display: flex; justify-content: space-between;">
                            Batch Size <span id="batch-size-value">1</span>
                        </label>
                        <input type="range" id="batch-size-slider" min="1" max="50" value="1" step="1"
                            style="width: 100%;">
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label for="system-prompt">System Prompt / Persona</label>
                <textarea id="system-prompt" rows="6" placeholder="Define how the AI should behave...">You are Gemma, a helpful AI assistant.</textarea>
                <button id="save-persona-btn" class="secondary-btn" style="margin-top: 10px; width: 100%;">Save
                    Persona</button>
            </div>

            <div class="setting-group" style="margin-top: auto;">
                <button id="export-btn" class="accent-btn" style="width: 100%; margin-bottom: 10px;">Export
                    Conversation</button>
                <button id="clear-btn" class="secondary-btn" style="width: 100%; margin-bottom: 10px;">Clear Conversation</button>
                <button id="logout-btn" class="secondary-btn" style="width: 100%; border-color: rgba(255, 75, 43, 0.3);">Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div id="progress-container" class="progress-hidden">
                <div id="progress-bar"></div>
            </div>
            <div id="chat-window">
                <div class="message ai-message">
                    Welcome back. I am currently running <strong>Gemma-3 12B (Heretic)</strong> by default.
                    Gemma-4 is also available in the sidebar. How can I assist you today?
                </div>
            </div>

            <div class="chat-input-area">
                <input type="file" id="chat-attachment" accept="image/*,text/*,.pdf,.md" style="display: none;">
                <button id="attach-btn" class="attach-btn" title="Attach file (Images, PDF, Text, MD)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <div id="attachment-preview" class="attachment-preview-hidden"></div>
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="stop-btn">New</button>
                <button id="send-btn">Send</button>
            </div>

            <div class="status-bar">
                <span id="status-server">Server: http://localhost:8000</span>
                <span id="status-context">Context: <span id="current-context">0</span> / Max: <span id="max-context">0</span> tokens</span>
                <span id="status-ollama">Ollama: http://localhost:11434</span>
            </div>
        </main>
    </div>

    <!-- Refactored JS -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
