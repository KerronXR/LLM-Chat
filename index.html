<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloxify Local AI | Uncensored</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/markdown.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/utility.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="icon" type="image/png" href="local_ai_icon.png">
</head>

<body>

    <div class="app-wrapper">
        <!-- Sidebar Settings -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="local_ai_icon.png" alt="Logo" class="app-logo">
                <h2>Veloxify AI</h2>
            </div>

            <div class="setting-group">
                <label for="model-select">Active Model</label>
                <select id="model-select">
                    <option value="gemma-4-e4b-it:latest" selected>Gemma-4 E4B (Official Turbo + Vision)</option>
                    <option value="llama-3.2-3b-instruct-uncensored:latest">Llama-3.2 3B (Fast Uncensored Direct)</option>
                    <option value="deepseek-r1-distill-qwen-7b-uncensored:latest">DeepSeek-R1 7B (Deep Uncensored Thinking)</option>
                </select>
            </div>



            <div class="setting-group">
                <label for="system-prompt">System Prompt / Persona</label>
                <textarea id="system-prompt" rows="6" placeholder="Define how the AI should behave...">You are Gemma, a helpful AI assistant.</textarea>
                <button id="save-persona-btn" class="secondary-btn" style="margin-top: 10px; width: 100%;">Save
                    Persona</button>
            </div>

            <div class="setting-group" style="margin-top: auto;">
                <button id="export-btn" class="accent-btn" style="width: 100%; margin-bottom: 10px;">Export
                    Conversation</button>
                <button id="clear-btn" class="secondary-btn" style="width: 100%; margin-bottom: 10px;">Clear Conversation</button>
                <button id="logout-btn" class="secondary-btn" style="width: 100%; border-color: rgba(255, 75, 43, 0.3);">Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div id="progress-container" class="progress-hidden">
                <div id="progress-bar"></div>
            </div>
            <div id="chat-window">
                <div class="message ai-message">
                    Welcome back. I am currently running <strong>Gemma-4 E4B (Official Turbo + MTP)</strong> by default.
                    How can I assist you today?
                </div>
            </div>

            <div class="chat-input-area">
                <input type="file" id="chat-attachment" accept="image/*,text/*,.pdf,.md" style="display: none;">
                <button id="attach-btn" class="attach-btn" title="Attach file (Images, PDF, Text, MD)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <button id="web-search-btn" class="web-search-btn web-search-auto" title="Web Search: Auto (Click to switch: Auto -> ON -> OFF)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span id="web-search-badge" class="web-search-badge">AUTO</span>
                </button>
                <div id="attachment-preview" class="attachment-preview-hidden"></div>
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="stop-btn">New</button>
                <button id="send-btn">Send</button>
            </div>

            <div class="status-bar">
                <span id="status-server">Server: http://localhost:8000</span>
                <span id="status-context">Context: <span id="current-context">0</span> / Max: <span id="max-context">0</span> tokens</span>
                <span id="status-ollama">Ollama: http://localhost:11434</span>
            </div>
        </main>
    </div>

    <!-- Refactored JS -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
