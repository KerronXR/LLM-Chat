<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Veloxify AI</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="icon" type="image/png" href="local_ai_icon.png">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-canvas);
        }
        .login-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(11, 87, 208, 0.15);
        }
        h1 {
            font-family: 'Google Sans', 'Outfit', sans-serif;
            margin-bottom: 8px;
            background: var(--accent-gemini);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: 700;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }
        input:focus {
            border-color: var(--accent-primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.12);
        }
        button {
            width: 100%;
            padding: 13px;
            background: var(--accent-primary);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.96rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            box-shadow: 0 2px 6px rgba(11, 87, 208, 0.2);
        }
        button:hover {
            background: var(--accent-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 87, 208, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .error-msg {
            color: #d93025;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="local_ai_icon.png" alt="Logo" class="login-logo">
            <h1>Veloxify AI</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Protected Area. Please enter password.</p>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autofocus>
            </div>
            
            <button id="login-btn">Login</button>
            <div id="error-msg" class="error-msg">Invalid password. Please try again.</div>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');

        async function doLogin() {
            const password = passInput.value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorMsg.style.display = 'block';
                    passInput.value = '';
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Connection error. Is the server running?');
            }
        }

        loginBtn.onclick = doLogin;
        passInput.onkeydown = (e) => {
            if (e.key === 'Enter') doLogin();
        };
    </script>
</body>
</html>
